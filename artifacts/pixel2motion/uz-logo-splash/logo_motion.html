<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uz Logo Splash Motion</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #ffffff;
      --surface: #f5f5f3;
      --border: rgba(0,0,0,0.08);
      --text-primary: #0d0d0d;
      --text-secondary: #777;
      --text-tertiary: #aaa;
      --accent: #e64036;
      --speed-progress: 9%;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
    }

    #logo-root {
      width: min(92vw, 716.8px);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: visible;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #logo-root svg {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible;
      text-rendering: geometricPrecision;
    }

    .atomic-motions {
      display: flex;
      gap: 1.5rem;
      align-items: flex-end;
      justify-content: center;
      flex-wrap: wrap;
    }

    .atom {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .atom-stage {
      width: 74px;
      height: 74px;
      display: grid;
      place-items: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .atom-stage img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 260ms cubic-bezier(0.34,1.56,0.64,1);
      transform-origin: center;
    }

    .atom-label {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      white-space: nowrap;
    }

    .principles {
      max-width: 760px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .pill {
      font-size: 11px;
      line-height: 1;
      padding: 5px 10px;
      border: 0.5px solid var(--border);
      border-radius: 999px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .pill.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      font: 12px/1.2 inherit;
      letter-spacing: 0.04em;
      padding: 8px 18px;
      border: 0.5px solid var(--border);
      border-radius: 999px;
      background: transparent;
      color: var(--text-primary);
      cursor: pointer;
    }

    button.primary {
      color: var(--bg);
      background: var(--text-primary);
      border-color: var(--text-primary);
    }

    .speed-control {
      width: min(340px, 80vw);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 12px;
      border: 0.5px solid var(--border);
      border-radius: 999px;
      color: var(--text-secondary);
    }

    .speed-caption,
    .speed-value {
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .speed-value {
      min-width: 46px;
      text-align: right;
      color: var(--text-primary);
      text-transform: none;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      flex: 1;
      min-width: 120px;
      height: 24px;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      cursor: grab;
      accent-color: var(--accent);
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--speed-progress), var(--border) var(--speed-progress), var(--border) 100%);
    }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      margin-top: -6.5px;
      border-radius: 50%;
      border: 2px solid var(--bg);
      background: var(--accent);
      box-shadow: 0 1px 6px rgba(0,0,0,0.18);
    }

    .footer {
      font-size: 11px;
      color: var(--text-tertiary);
      text-align: center;
      line-height: 1.7;
    }

    .p2m-chromeless .atomic-motions,
    .p2m-chromeless .principles,
    .p2m-chromeless .controls,
    .p2m-chromeless .footer {
      display: none;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      :root {
        --p2m-duration: 1720ms;
        --p2m-ease-flight: cubic-bezier(0.18, 0.86, 0.24, 1);
        --p2m-ease-morph: cubic-bezier(0.22, 0.78, 0.18, 1);
        --p2m-ease-impact: cubic-bezier(0.34, 0, 0.18, 1);
        --p2m-ease-settle: cubic-bezier(0.4, 0, 0.2, 1);
      }

      #logo-root svg {
        overflow: hidden;
      }

      #mark {
        transform-box: fill-box;
        transform-origin: center;
        animation: p2m-mark-stage var(--p2m-duration) linear both;
      }

      #ball,
      #u-fill,
      #z-fill,
      #u-draw,
      #z-draw {
        transform-box: fill-box;
        transform-origin: center;
      }

      #ball {
        animation: p2m-ball var(--p2m-duration) linear both;
      }

      #u-fill {
        animation: p2m-u-morph var(--p2m-duration) linear both;
      }

      #z-fill {
        animation: p2m-z-morph var(--p2m-duration) linear both;
      }

      #u-draw,
      #z-draw {
        stroke-dasharray: 1 1.2;
        stroke-dashoffset: 1.1;
        stroke-width: 100;
        vector-effect: none;
      }

      #u-draw {
        opacity: 0;
      }

      #z-draw {
        animation: p2m-z-draw var(--p2m-duration) linear both;
      }

      @keyframes p2m-ball {
        0%,
        3% {
          opacity: 1;
          transform: translateY(0) scaleX(1) scaleY(1);
          filter: blur(0.6px);
        }
        3% {
          animation-timing-function: cubic-bezier(0.18, 0.86, 0.24, 1); /* --p2m-ease-flight */
        }
        26% {
          opacity: 1;
          transform: translateY(-544px) scaleX(0.88) scaleY(1.14);
          filter: blur(0);
        }
        42% {
          opacity: 0.9;
          transform: translateY(-544px) scaleX(0.74) scaleY(0.92);
          animation-timing-function: cubic-bezier(0.34, 0, 0.18, 1); /* --p2m-ease-impact */
        }
        50% {
          opacity: 0;
          transform: translateY(-544px) scaleX(0.42) scaleY(0.68);
        }
        100% {
          opacity: 0;
          transform: translateY(-544px) scaleX(0.42) scaleY(0.68);
        }
      }

      @keyframes p2m-u-morph {
        0%,
        22% {
          opacity: 0;
          transform: scale(0.01);
        }
        24% {
          opacity: 1;
          transform: scale(0.22);
          animation-timing-function: cubic-bezier(0.34, 0, 0.18, 1); /* --p2m-ease-impact */
        }
        50% {
          opacity: 1;
          transform: scale(1);
          animation-timing-function: cubic-bezier(0.22, 0.78, 0.18, 1); /* --p2m-ease-morph */
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes p2m-u-draw {
        0%,
        22% {
          opacity: 0;
          stroke-dashoffset: 1.1;
          transform: scale(0.01);
        }
        24% {
          opacity: 0.26;
          stroke-dashoffset: 0.88;
          transform: scale(0.22);
          animation-timing-function: cubic-bezier(0.34, 0, 0.18, 1); /* --p2m-ease-impact */
        }
        50% {
          opacity: 0.62;
          stroke-dashoffset: 0;
          transform: scale(1);
          animation-timing-function: cubic-bezier(0.22, 0.78, 0.18, 1); /* --p2m-ease-morph */
        }
        58% {
          opacity: 0;
          stroke-dashoffset: 0;
          transform: scale(1);
        }
        100% {
          opacity: 0;
          stroke-dashoffset: 0;
          transform: scale(1);
        }
      }

      @keyframes p2m-z-morph {
        0%,
        40% {
          opacity: 0;
          transform: scale(0.01);
        }
        42% {
          opacity: 0;
          transform: scale(0.20);
          animation-timing-function: cubic-bezier(0.34, 0, 0.18, 1); /* --p2m-ease-impact */
        }
        60% {
          opacity: 0;
          transform: scale(0.95);
        }
        64% {
          opacity: 1;
          transform: scale(1);
          animation-timing-function: cubic-bezier(0.22, 0.78, 0.18, 1); /* --p2m-ease-morph */
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes p2m-z-draw {
        0%,
        40% {
          opacity: 0;
          stroke-dashoffset: 1.1;
          transform: scale(0.01);
        }
        42% {
          opacity: 1;
          stroke-dashoffset: 0.98;
          transform: scale(0.20);
          animation-timing-function: cubic-bezier(0.38, 0, 0.62, 1); /* eased z handoff */
        }
        64% {
          opacity: 1;
          stroke-dashoffset: 0;
          transform: scale(1);
          animation-timing-function: cubic-bezier(0.22, 0.78, 0.18, 1); /* --p2m-ease-morph */
        }
        71% {
          opacity: 0;
          stroke-dashoffset: 0;
          transform: scale(1);
        }
        100% {
          opacity: 0;
          stroke-dashoffset: 0;
          transform: scale(1);
        }
      }

      @keyframes p2m-mark-stage {
        0%,
        64% {
          transform: scale(1);
        }
        68% {
          transform: scale(0.985);
          animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); /* --p2m-ease-settle */
        }
        72%,
        100% {
          transform: scale(1);
        }
      }
    }
  </style>
</head>
<body>
  <main id="logo-root" aria-label="Animated logo" data-p2m-duration="1720"></main>

  <section class="atomic-motions" aria-label="Atomic motion studies">
    <div class="atom" data-atom="hover"><div class="atom-stage"></div><span class="atom-label">Hover</span></div>
    <div class="atom" data-atom="pulse"><div class="atom-stage"></div><span class="atom-label">Pulse</span></div>
    <div class="atom" data-atom="arc"><div class="atom-stage"></div><span class="atom-label">Arc</span></div>
    <div class="atom" data-atom="press"><div class="atom-stage"></div><span class="atom-label">Press</span></div>
  </section>

  <div class="principles" id="principlesRow">
    <span class="pill" data-p="squashstretch">Squash &amp; stretch</span>
    <span class="pill" data-p="anticipation">Anticipation</span>
    <span class="pill" data-p="staging">Staging</span>
    <span class="pill" data-p="followthrough">Follow through</span>
    <span class="pill" data-p="overlap">Overlapping</span>
    <span class="pill" data-p="slowinout">Slow in / out</span>
    <span class="pill" data-p="arc">Arc</span>
    <span class="pill" data-p="secondary">Secondary action</span>
    <span class="pill" data-p="timing">Timing</span>
    <span class="pill" data-p="appeal">Appeal</span>
  </div>

  <div class="controls">
    <button class="primary" id="btnReplay" type="button">Replay</button>
    <button id="btnSlow" type="button">Slow motion</button>
    <label class="speed-control" for="speedSlider">
      <span class="speed-caption">Speed</span>
      <input id="speedSlider" type="range" min="0.25" max="2.5" step="0.05" value="0.45" aria-label="Animation speed">
      <span class="speed-value" id="speedValue">0.45x</span>
    </label>
  </div>

  <p class="footer">Click the main logo to replay | Drag speed | Try atomic motions</p>

  <script>
    const SVG_NS = "http://www.w3.org/2000/svg";
    const LOGO = {"tag":"svg","attrs":{"width":"1024","height":"1024","viewBox":"0 0 1024 1024","role":"img","aria-labelledby":"title desc"},"children":[{"tag":"title","attrs":{"id":"title"},"children":[],"text":"Uz logo"},{"tag":"desc","attrs":{"id":"desc"},"children":[],"text":"A black rounded U joined to a compact lowercase z."},{"tag":"g","attrs":{"id":"logo","fill":"#000000","fill-rule":"nonzero","shape-rendering":"geometricPrecision"},"children":[{"tag":"g","attrs":{"id":"mark"},"children":[{"tag":"circle","attrs":{"id":"ball","cx":"397","cy":"1044","r":"50","fill":"#000000","opacity":"0"},"children":[]},{"tag":"path","attrs":{"id":"u-fill","d":"M 227 256 H 287 C 301 256 312 269 312 286 V 568 C 312 612 350 642 397 642 C 444 642 482 612 482 568 V 395 C 482 374 499 357 520 357 H 556 C 578 357 593 374 593 395 V 440 C 593 451 590 459 587 465 V 570 C 587 667 504 740 397 740 C 290 740 202 674 202 570 V 286 C 202 269 213 256 227 256 Z"},"children":[]},{"tag":"path","attrs":{"id":"z-fill","d":"M 520 357 H 777 C 797 357 815 370 826 389 C 837 408 837 433 829 452 C 825 461 820 470 814 477 L 684 630 C 678 637 675 644 681 648 H 816 C 826 650 837 660 841 669 V 711 C 841 728 830 739 816 739 H 631 C 603 739 580 711 572 677 C 572 652 579 633 594 613 L 709 474 C 715 466 715 458 707 453 C 704 451 701 450 697 450 H 602 C 594 450 587 457 587 465 V 395 C 587 374 571 357 550 357 Z"},"children":[]}]},{"tag":"g","attrs":{"id":"draw-guides","fill":"none","stroke":"#000000","pointer-events":"none"},"children":[{"tag":"path","attrs":{"id":"u-draw","d":"M 257 310 V 568 C 257 640 318 692 397 692 C 476 692 532 640 532 568 V 411","pathLength":"1","stroke-width":"100","stroke-linecap":"round","stroke-linejoin":"round","opacity":"0"},"children":[]},{"tag":"path","attrs":{"id":"z-draw","d":"M 536 405 H 774 L 623 694 H 793","pathLength":"1","stroke-width":"91","stroke-linecap":"round","stroke-linejoin":"round","opacity":"0"},"children":[]}]}]}]};
    const SVG_TEXT = "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1024\" height=\"1024\" viewBox=\"0 0 1024 1024\" role=\"img\" aria-labelledby=\"title desc\"><style>:root,svg{--bg:#ffffff;--surface:#f5f5f3;--text-primary:#0d0d0d;--text-secondary:#777;--text-tertiary:#aaa;--logo-wordmark:#363e47;--accent:#e64036;--red:#e64036;--red-bright:#ff493f;}<\/style>\n  <title id=\"title\">Uz logo<\/title>\n  <desc id=\"desc\">A black rounded U joined to a compact lowercase z.<\/desc>\n  <g id=\"logo\" fill=\"#000000\" fill-rule=\"nonzero\" shape-rendering=\"geometricPrecision\">\n    <g id=\"mark\">\n      <circle id=\"ball\" cx=\"397\" cy=\"1044\" r=\"50\" fill=\"#000000\" opacity=\"0\"/>\n      <path id=\"u-fill\" d=\"M 227 256 H 287 C 301 256 312 269 312 286 V 568 C 312 612 350 642 397 642 C 444 642 482 612 482 568 V 395 C 482 374 499 357 520 357 H 556 C 578 357 593 374 593 395 V 440 C 593 451 590 459 587 465 V 570 C 587 667 504 740 397 740 C 290 740 202 674 202 570 V 286 C 202 269 213 256 227 256 Z\"/>\n      <path id=\"z-fill\" d=\"M 520 357 H 777 C 797 357 815 370 826 389 C 837 408 837 433 829 452 C 825 461 820 470 814 477 L 684 630 C 678 637 675 644 681 648 H 816 C 826 650 837 660 841 669 V 711 C 841 728 830 739 816 739 H 631 C 603 739 580 711 572 677 C 572 652 579 633 594 613 L 709 474 C 715 466 715 458 707 453 C 704 451 701 450 697 450 H 602 C 594 450 587 457 587 465 V 395 C 587 374 571 357 550 357 Z\"/>\n    <\/g>\n    <g id=\"draw-guides\" fill=\"none\" stroke=\"#000000\" pointer-events=\"none\">\n      <path id=\"u-draw\" d=\"M 257 310 V 568 C 257 640 318 692 397 692 C 476 692 532 640 532 568 V 411\" pathLength=\"1\" stroke-width=\"100\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\"0\"/>\n      <path id=\"z-draw\" d=\"M 536 405 H 774 L 623 694 H 793\" pathLength=\"1\" stroke-width=\"91\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\"0\"/>\n    <\/g>\n  <\/g>\n<\/svg>\n";
    const SVG_URI = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(SVG_TEXT);
    const DURATION = 1720;

    let playbackRate = 0.45;
    let pulseRaf = null;
    let arcRaf = null;
    window.__p2mReady = false;

    function createSvgNode(node) {
      const element = document.createElementNS(SVG_NS, node.tag);
      for (const [name, value] of Object.entries(node.attrs || {})) {
        element.setAttribute(name, value);
      }
      if (node.text) {
        element.appendChild(document.createTextNode(node.text));
      }
      for (const child of node.children || []) {
        element.appendChild(createSvgNode(child));
      }
      return element;
    }

    function heroAnimations() {
      const root = document.getElementById("logo-root");
      if (root.getAnimations) return root.getAnimations({ subtree: true });
      return document.getAnimations().filter(animation => {
        const target = animation.effect && animation.effect.target;
        return target && root.contains(target);
      });
    }

    function applyPlaybackRate() {
      for (const animation of heroAnimations()) {
        if (animation.updatePlaybackRate) animation.updatePlaybackRate(playbackRate);
        else animation.playbackRate = playbackRate;
      }
    }

    function renderHero() {
      const root = document.getElementById("logo-root");
      root.replaceChildren(createSvgNode(LOGO));
      const svg = root.querySelector("svg");
      if (svg) {
        svg.removeAttribute("width");
        svg.removeAttribute("height");
        svg.style.width = "100%";
        svg.style.height = "auto";
        svg.style.overflow = "visible";
      }
      requestAnimationFrame(() => requestAnimationFrame(applyPlaybackRate));
    }

    function flashPills(...names) {
      document.querySelectorAll(".pill").forEach(pill => pill.classList.remove("active"));
      names.forEach(name => {
        const pill = document.querySelector(`[data-p="${name}"]`);
        if (pill) pill.classList.add("active");
      });
    }

    function cyclePrinciples() {
      const phases = [
        ["staging", "timing"],
        ["anticipation", "squashstretch"],
        ["arc", "slowinout"],
        ["overlap", "followthrough"],
        ["appeal"]
      ];
      let i = 0;
      flashPills(...phases[0]);
      return setInterval(() => {
        i = (i + 1) % phases.length;
        flashPills(...phases[i]);
      }, Math.max(240, DURATION / phases.length / Math.max(playbackRate, 0.25)));
    }

    let pillTimer = null;
    function replayMain() {
      clearInterval(pillTimer);
      renderHero();
      pillTimer = cyclePrinciples();
      setTimeout(() => {
        clearInterval(pillTimer);
        document.querySelectorAll(".pill").forEach(pill => pill.classList.remove("active"));
      }, DURATION / Math.max(playbackRate, 0.25) + 600);
    }

    function formatSpeed(rate) {
      return `${rate.toFixed(2)}x`;
    }

    function updateSpeedUI() {
      const slider = document.getElementById("speedSlider");
      const value = Number(slider.value);
      const min = Number(slider.min);
      const max = Number(slider.max);
      const progress = ((value - min) / (max - min)) * 100;
      document.getElementById("speedValue").textContent = formatSpeed(value);
      slider.style.setProperty("--speed-progress", `${progress}%`);
      const slow = value <= 0.251;
      const btnSlow = document.getElementById("btnSlow");
      btnSlow.textContent = slow ? "Normal speed" : "Slow motion";
      btnSlow.style.background = slow ? "var(--surface)" : "";
      btnSlow.style.borderColor = slow ? "var(--text-secondary)" : "";
    }

    function setPlaybackRate(rate, replay = false) {
      const slider = document.getElementById("speedSlider");
      const min = Number(slider.min);
      const max = Number(slider.max);
      playbackRate = Math.min(max, Math.max(min, Number(rate)));
      slider.value = String(playbackRate);
      updateSpeedUI();
      applyPlaybackRate();
      if (replay) replayMain();
    }

    function setupAtomImages() {
      document.querySelectorAll(".atom-stage").forEach(stage => {
        const img = new Image();
        img.src = SVG_URI;
        img.alt = "";
        stage.appendChild(img);
      });
    }

    function setupAtoms() {
      const hover = document.querySelector('[data-atom="hover"] img');
      const pulse = document.querySelector('[data-atom="pulse"] img');
      const arc = document.querySelector('[data-atom="arc"] img');
      const press = document.querySelector('[data-atom="press"] img');

      hover.parentElement.addEventListener("mouseenter", () => {
        flashPills("squashstretch", "appeal");
        hover.style.transform = "scale(1.08) rotate(-1.5deg)";
      });
      hover.parentElement.addEventListener("mouseleave", () => {
        hover.style.transform = "scale(1)";
      });

      function pulseTick(ts) {
        const p = (Math.sin(ts / 900) + 1) / 2;
        pulse.style.transform = `scale(${1 + 0.1 * p})`;
        pulseRaf = requestAnimationFrame(pulseTick);
      }
      if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        pulseRaf = requestAnimationFrame(pulseTick);
      }

      let arcAngle = -14;
      let arcVel = 0;
      function arcTick() {
        arcVel += (0 - arcAngle) * 0.08;
        arcVel *= 0.86;
        arcAngle += arcVel;
        arc.style.transform = `rotate(${arcAngle}deg)`;
        arcRaf = requestAnimationFrame(arcTick);
      }
      arc.parentElement.addEventListener("mouseenter", () => {
        flashPills("arc", "anticipation", "appeal");
        cancelAnimationFrame(arcRaf);
        arcAngle = 28;
        arcVel = 0;
        arcTick();
      });
      arc.parentElement.addEventListener("mouseleave", () => {
        arcAngle = 0;
      });

      press.parentElement.addEventListener("mousedown", () => {
        flashPills("squashstretch", "anticipation");
        press.style.transform = "scaleX(1.10) scaleY(0.88)";
      });
      ["mouseup", "mouseleave"].forEach(ev => {
        press.parentElement.addEventListener(ev, () => {
          press.style.transform = "scale(1)";
        });
      });
    }

    function applyQaMode() {
      const params = new URLSearchParams(location.search);
      const seekMs = params.get("t");
      const staticMode = params.get("static");
      if (seekMs === null && staticMode === null) {
        requestAnimationFrame(() => requestAnimationFrame(() => {
          applyPlaybackRate();
          window.__p2mReady = true;
        }));
        return;
      }

      document.documentElement.classList.add("p2m-chromeless");
      cancelAnimationFrame(pulseRaf);
      cancelAnimationFrame(arcRaf);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        for (const animation of heroAnimations()) {
          if (staticMode !== null) {
            try {
              animation.finish();
            } catch (err) {
              animation.cancel();
            }
          } else {
            animation.pause();
            animation.currentTime = Number(seekMs);
          }
        }
        window.__p2mReady = true;
      }));
    }

    document.getElementById("btnReplay").addEventListener("click", replayMain);
    document.getElementById("logo-root").addEventListener("click", replayMain);
    document.getElementById("speedSlider").addEventListener("input", event => {
      setPlaybackRate(event.target.value, false);
    });
    document.getElementById("btnSlow").addEventListener("click", () => {
      const slow = Number(document.getElementById("speedSlider").value) <= 0.251;
      setPlaybackRate(slow ? 0.45 : 0.25, true);
    });

    setupAtomImages();
    setupAtoms();
    setPlaybackRate(0.45, false);
    renderHero();
    applyQaMode();
  </script>
</body>
</html>
