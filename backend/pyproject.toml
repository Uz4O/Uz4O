[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pc-builder-api"
version = "0.1.0"
description = "Backend API for the AI PC-building assistant"
requires-python = ">=3.9"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "paddleocr>=2.8,<4",
    "psycopg[binary]>=3.2,<4",
    "PyJWT[crypto]>=2.8,<3",
    "python-multipart>=0.0.9,<1",
    "pydantic-settings>=2.6,<3",
    "redis>=5,<6",
    "SQLAlchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
